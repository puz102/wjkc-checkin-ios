name: Smoke tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: |
          for file in */*.js tests/*.js; do
            node --check "$file"
          done
      - name: Run smoke tests
        run: node tests/smoke-test.js
